<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finfit offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08090d;
        color: #f0f3ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 24px;
        background: rgba(18,21,30,.88);
        padding: 24px;
      }
      h1 { margin: 0 0 10px; }
      p { color: rgba(240,243,255,.72); }
    </style>
  </head>
  <body>
    <main>
      <h1>Finfit offline</h1>
      <p>O app principal fica salvo para uso offline depois do primeiro carregamento. Volte para a tela anterior ou reabra o Finfit.</p>
    </main>
  </body>
</html>
